# Add as .github/workflows/daily_news_sentiment.yml in eladyesh/stock-screener-daily.
# It adds a separate news run; it does not change the existing stock scan.
name: Daily News Opportunities to Telegram
on:
  schedule:
    - cron: '30 7 * * *'
      timezone: Asia/Jerusalem
  workflow_dispatch:
    inputs:
      send_telegram:
        description: Send a full English news opportunity report
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  news:
    uses: eladyesh/stock-news-sentiment-daily/.github/workflows/news.yml@2146cdd8eb2903aaad3ffcba625ecf5c854a11f3
    with:
      smoke: false
      send_telegram: ${{ github.event_name == 'schedule' || inputs.send_telegram }}
      code_ref: 2146cdd8eb2903aaad3ffcba625ecf5c854a11f3
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
