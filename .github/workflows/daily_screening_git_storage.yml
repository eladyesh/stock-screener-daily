name: Daily Stock Scan and Email

on:
  schedule:
    # Every day, 07:17 UTC (10:17 Israel summer / 09:17 winter).
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Full universe or a five-stock smoke check'
        type: choice
        options: [full, smoke]
        default: full
      send_email:
        description: 'Send the report using the configured SMTP secrets'
        type: boolean
        default: true

concurrency:
  group: daily-stock-scan
  cancel-in-progress: false

permissions:
  contents: write # Persist the original scanner's cache and dated reports.

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: UTC
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      SCAN_MODE: ${{ inputs.scan_mode || 'full' }}
      SEND_EMAIL: ${{ github.event_name != 'workflow_dispatch' || inputs.send_email }}
    steps:
      - name: Check out this fork
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Remove previous report before this attempt
        run: |
          mkdir -p data/daily_scans data/logs
          rm -f data/daily_scans/latest_optimized_scan.txt data/daily_scans/latest_scan_manifest.json

      - name: Check email configuration
        if: env.SEND_EMAIL == 'true'
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SMTP_SERVER: ${{ vars.EMAIL_SMTP_SERVER || 'smtp.gmail.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
        run: python3 scripts/send_daily_report.py --check-config

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the scanner
        id: scan
        timeout-minutes: 160
        shell: bash
        run: |
          set -euo pipefail
          args=(--conservative --git-storage)
          if [[ "$SCAN_MODE" == 'smoke' ]]; then
            args+=(--tickers AAPL,MSFT,NVDA,AMZN,GOOGL)
          fi
          python run_optimized_scan.py "${args[@]}" 2>&1 | tee data/logs/daily-scan.log
          python -c "from pathlib import Path; from scripts.send_daily_report import load_current_report; load_current_report(Path('data/daily_scans/latest_optimized_scan.txt'), Path('data/daily_scans/latest_scan_manifest.json'))"

      - name: Publish scan summary
        if: steps.scan.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('data/daily_scans/latest_scan_manifest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('# Stock screening report\n\n')
              out.write(f"Mode: {os.environ['SCAN_MODE']}. Generated UTC: {data['generated_at']}\n\n")
              out.write(f"Analyzed **{data['analyzed']} / {data['universe']}** universe entries. ")
              out.write(f"Buy: **{data['buy_signals']}**; sell: **{data['sell_signals']}**.\n\n")
              out.write(f"Request errors: {data['error_rate']:.1%}. Price-bar dates: {', '.join(data['price_dates'])}.\n\n")
              out.write('The full report is an artifact. A smoke check is not a market-wide scan.\n\n')
              if os.environ['SEND_EMAIL'] != 'true':
                  out.write('**Email was disabled for this manual verification run.**\n')
          PY

      - name: Preserve this scan and fundamental cache
        if: steps.scan.outcome == 'success' && env.SCAN_MODE == 'full'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fundamentals_cache/ data/daily_scans/
          if ! git diff --cached --quiet; then
            git commit -m "Daily scan $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Email the complete report
        if: always() && steps.scan.outcome == 'success' && env.SEND_EMAIL == 'true'
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SMTP_SERVER: ${{ vars.EMAIL_SMTP_SERVER || 'smtp.gmail.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
        run: |
          python scripts/send_daily_report.py
          echo 'SMTP accepted the report. Inbox placement is controlled by the mail provider.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload this attempt's report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stock-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/daily_scans/latest_optimized_scan.txt
            data/daily_scans/latest_scan_manifest.json
            data/logs/daily-scan.log
          if-no-files-found: warn
          retention-days: 30
